name = "wordcraft-server"
main = "src/worker.js"
compatibility_date = "2026-09-03"

# Container config
[[containers]]
class_name = "GameServer"
image = "./Dockerfile"
max_instances = 5

# Durable Object binding
[[durable_objects.bindings]]
class_name = "GameServer"
name = "GAME_SERVER"

# Required migration for Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameServer"]
